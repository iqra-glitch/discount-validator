<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discount Code Validator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="product-card">

    <h1 class="product-name">Wireless Headphones</h1>

    <p class="price-row">
      <span>Price:</span>
      <span id="original-price">$50.00</span>
    </p>

    <div class="coupon-section">
      <label for="coupon-input">Discount code</label>
      <input type="text" id="coupon-input" placeholder="Enter code e.g. SAVE10">
      <button id="apply-btn">Apply</button>
    </div>

    <p id="message"></p>

    <p class="price-row final-price-row">
      <span>Final Price:</span>
      <span id="final-price">$50.00</span>
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
